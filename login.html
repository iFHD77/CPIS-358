<!DOCTYPE html>

<html>

<head>
    <meta charset="UTF-8">
    <title>Student Events - Login</title>
    <link rel="stylesheet" href="style.css">

    <!-- external JavaScript file -->
    <script type="text/javascript" src="script.js"></script>
</head>

<body>

    <h1 id="top">Student Events - Login</h1>

    <div class="image-box" onmouseover="highlightPicture()" onmouseout="restorePicture()">

        <img id="eventImage" src="events.jpg" alt="Student Events" width="400" height="300" usemap="#eventsmap">

        <span class="event-badge" id="badge">Student Events</span>

        <map name="eventsmap">
            <area shape="rect" coords="0,0,400,300" href="about.html" alt="About Us">
        </map>

    </div>


    <nav>
    <ul>
        <li><a href="index.html">Home</a></li>
        <li><a href="login.html">Login</a></li>
        <li><a href="signup.html">Sign Up</a></li>
        <li><a href="about.html">About Us</a></li>
        <li class="dropdown">Explore
            <ul>
                <li><a href="index.html#why">Why Use Us</a></li>
                <li><a href="index.html#events">Upcoming Events</a></li>
            </ul>
        </li>
    </ul>
    </nav>


    <h2>Login</h2>
    <form name="loginForm" method="post" onsubmit="return completeLogin()" onreset="clearLogin()">

        <p>
            <label for="email">Email:</label>
            <input type="email" id="email" name="email" placeholder="Enter Your Email"
                   onfocus="highlightField(this)" onblur="restoreField(this)">
        </p>

        <p>
            <label for="password">Password:</label>
            <input type="password" id="password" name="password" placeholder="Enter Your Password"
                   onfocus="highlightField(this)" onblur="restoreField(this)">
        </p>

        <!-- messages from the script appear here -->
        <p id="formMessage"></p>

        <input type="submit" value="Login" onclick="return validateLogin()">
        <input type="reset" value="Clear">

        <p>Don't have an account? <a href="signup.html">Sign Up</a></p>
    </form>

    <footer>
        <p>&copy; 2026 Student Events - Group 6 </p>
    </footer>

</body>

</html>
