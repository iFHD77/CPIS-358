<!DOCTYPE html>

<html>

<head>
    <meta charset="UTF-8">
    <title>Student Events - Sign Up</title>
       <link rel="stylesheet" href="style.css">
</head>

<body>

    <h1>Student Events - Sign Up</h1>

    <a href="about.html">
    <img src="events.jpg" alt="Student Events"
         width="500" height="300">
</a>


    <nav>
        <a href="index.html">Home</a>
        <a href="login.html">Login</a>
        <a href="signup.html">Sign Up</a>
        <a href="about.html">About Us</a>
    </nav>

    <h2>Create Account</h2>
	
    <form method="post">

    <p>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name">
    </p>

    <p>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email">
    </p>

    <p>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password">
    </p>

    <p>
        <label for="confirm">Confirm Password:</label>
        <input type="password" id="confirm" name="confirm">
    </p>

    <p>
        <label for="category">Favorite Event Category:</label>

        <select id="category" name="category">
    		<option value="workshops">Workshops</option>
    		<option value="sports">Sports</option>
    		<option value="career">Career Events</option>
   		<option value="activities">Student Activities</option>
	</select>
    </p>

    <input type="submit" value="Sign Up">
    <input type="reset" value="Clear">

    </form>

</body>

</html>
