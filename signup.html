    <h2>Create Account</h2>
	
    <form method="post">
        <p>
    <label for="ID">Student ID:</label>
    <input type="text" id="ID" name="ID" placeholder="Enter ID"
           maxlength="7" pattern="[0-9]{7}" autofocus required>
    </p>
		
    <p>
        <label for="name">Full Name:</label>
        <input type="text" id="name" name="name" placeholder="Full Name">
    </p>

    <p>
        <label for="email">Email:</label>
        <input type="email" id="email" name="email" placeholder="Email Address">
    </p>

    <p>
        <label for="password">Password:</label>
        <input type="password" id="password" name="password" placeholder="password">
    </p>

    <p>
        <label for="confirm">Confirm Password:</label>
        <input type="password" id="confirm" name="confirm" placeholder="Confirm password">
    </p>

    <p>
        <label for="category">Favorite Event Category:</label>

        <select id="category" name="category">
    		<option value="workshops">Workshops</option>
    		<option value="sports">Sports</option>
    		<option value="career">Career Events</option>
   		<option value="activities">Student Activities</option>
	</select>
    <p>
    <input type="checkbox" id="terms" name="terms" value="agree" checked>
    <label for="terms">I agree to receive event updates</label>
</p>
    </p>

    <input type="submit" value="Sign Up">
    <input type="reset" value="Clear">

    <p>Already have an account? <a href="login.html">Login</a></p>
    </form>
